<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-label="What I bring: End-to-end ownership; Architecture that scales; Data done right; Observability &amp; monitoring; Performance under load; Security &amp; reliability; Delivery that lasts; Technical leadership"><style>.bg{fill:#fafafa}.panel{fill:#ffffff;stroke:#e2e2e2}.grid{stroke:#ececec}.ink{fill:#111111}.mute{fill:#6b6b6b}.faint{fill:#9a9a9a}.chip{fill:#f3f3f3;stroke:#dcdcdc}.rule{stroke:#e2e2e2}.inkS{stroke:#111111}.dot{fill:#fafafa;stroke:#111111}.acc{fill:#111111}.accS{stroke:#111111}.chipA{fill:#111111;fill-opacity:.07;stroke:#111111}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.panel{fill:#121820;stroke:#262f3a}.grid{stroke:#18202a}.ink{fill:#e6edf3}.mute{fill:#8b949e}.faint{fill:#5d6773}.chip{fill:#161d26;stroke:#2a3440}.rule{stroke:#262f3a}.inkS{stroke:#e6edf3}.dot{fill:#0d1117;stroke:#e6edf3}.acc{fill:#e6edf3}.accS{stroke:#e6edf3}.chipA{fill:#e6edf3;fill-opacity:.07;stroke:#e6edf3}}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}.sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}@keyframes pulse{0%{r:6;opacity:.55}100%{r:16;opacity:0}}.pulse{animation:pulse 2s ease-out infinite}</style><rect class="bg rule" x=".5" y=".5" width="959" height="583" rx="16" stroke-width="1"/><g class="grid" stroke-width="1"><path d="M80 0V584"/><path d="M160 0V584"/><path d="M240 0V584"/><path d="M320 0V584"/><path d="M400 0V584"/><path d="M480 0V584"/><path d="M560 0V584"/><path d="M640 0V584"/><path d="M720 0V584"/><path d="M800 0V584"/><path d="M880 0V584"/></g><text x="40" y="50" class="mono" font-size="14" letter-spacing="2"><tspan class="acc">02</tspan><tspan class="faint"> ── </tspan><tspan class="mute">WHAT I BRING</tspan></text><rect class="panel" x="40" y="80" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M40 104V160" stroke-width="3" stroke-linecap="round"/><circle cx="84" cy="132" r="9" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="132" r="3" class="acc"/><text x="118" y="124" class="sans ink" font-size="20" font-weight="600">End-to-end ownership</text><text x="118" y="152" class="sans mute" font-size="16">I own the system, not just the ticket.</text><text x="452" y="110" text-anchor="end" class="mono faint" font-size="13">01</text><rect class="panel" x="488" y="80" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M488 104V160" stroke-width="3" stroke-linecap="round"/><path d="M522 140h6v-6h6v-6h6v-6" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="124" class="sans ink" font-size="20" font-weight="600">Architecture that scales</text><text x="566" y="152" class="sans mute" font-size="16">Grows with the business, no rewrite needed.</text><text x="900" y="110" text-anchor="end" class="mono faint" font-size="13">02</text><rect class="panel" x="40" y="200" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M40 224V280" stroke-width="3" stroke-linecap="round"/><ellipse cx="84" cy="246" rx="9" ry="3.5" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 246v12c0 2 4 3.5 9 3.5s9-1.5 9-3.5v-12" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="244" class="sans ink" font-size="20" font-weight="600">Data done right</text><text x="118" y="272" class="sans mute" font-size="16">Postgres, designed and tuned to last.</text><text x="452" y="230" text-anchor="end" class="mono faint" font-size="13">03</text><rect class="panel" x="488" y="200" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M488 224V280" stroke-width="3" stroke-linecap="round"/><path d="M521 252h5l3-7 5 14 3-7h6" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="244" class="sans ink" font-size="20" font-weight="600">Observability &amp; monitoring</text><text x="566" y="272" class="sans mute" font-size="16">Issues caught before users report them.</text><text x="900" y="230" text-anchor="end" class="mono faint" font-size="13">04</text><rect class="panel" x="40" y="320" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M40 344V400" stroke-width="3" stroke-linecap="round"/><path d="M74 378a10 10 0 1 1 20 0" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M84 378l5-7" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="364" class="sans ink" font-size="20" font-weight="600">Performance under load</text><text x="118" y="392" class="sans mute" font-size="16">Capacity measured, never guessed.</text><text x="452" y="350" text-anchor="end" class="mono faint" font-size="13">05</text><rect class="panel" x="488" y="320" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M488 344V400" stroke-width="3" stroke-linecap="round"/><path d="M532 362l8 3v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10v-6z" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="364" class="sans ink" font-size="20" font-weight="600">Security &amp; reliability</text><text x="566" y="392" class="sans mute" font-size="16">Built in from day one, not bolted on.</text><text x="900" y="350" text-anchor="end" class="mono faint" font-size="13">06</text><rect class="panel" x="40" y="440" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M40 464V520" stroke-width="3" stroke-linecap="round"/><path d="M75 486l9-5 9 5-9 5z" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 492l9 5 9-5M75 498l9 5 9-5" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="484" class="sans ink" font-size="20" font-weight="600">Delivery that lasts</text><text x="118" y="512" class="sans mute" font-size="16">Code the next engineer can ship on day one.</text><text x="452" y="470" text-anchor="end" class="mono faint" font-size="13">07</text><rect class="panel" x="488" y="440" width="432" height="104" rx="12" stroke-width="1"/><path class="accS" d="M488 464V520" stroke-width="3" stroke-linecap="round"/><circle cx="526" cy="492" r="3" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="539" cy="485" r="3" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="539" cy="499" r="3" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M529 491l7-4M529 493l7 4" class="accS" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="566" y="484" class="sans ink" font-size="20" font-weight="600">Technical leadership</text><text x="566" y="512" class="sans mute" font-size="16">Trade-offs explained in business terms.</text><text x="900" y="470" text-anchor="end" class="mono faint" font-size="13">08</text></svg>
